<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOONPUMP.EXE</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#060914;
  color:white;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:60px;
  background:linear-gradient(45deg,#fff,#ffd84d,#ff7a18);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.btn{
  padding:14px 22px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

.buy{
  background:linear-gradient(135deg,#ff7a18,#ffd84d);
  color:black;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

.card{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:14px;
  margin-top:20px;
}

.live{
  background:black;
  padding:10px;
  overflow:hidden;
  white-space:nowrap;
}

.live span{
  margin-right:30px;
  color:#7cff5b;
}

.green{color:#7cff5b}
.red{color:#ff4d4d}

.bar{
  height:10px;
  background:#222;
  border-radius:6px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#7cff5b,#ffd84d,#ff7a18);
  width:0%;
  transition:0.4s;
}

.trend{
  font-weight:bold;
  margin-top:10px;
}

.priceFlash{
  animation:flash 0.4s;
}

@keyframes flash{
  from{color:#7cff5b}
  to{color:white}
}

</style>
</head>

<body>

<div class="live" id="ticker">Loading live activity...</div>

<div class="wrap">

<h1>🚀 MOONPUMP.EXE</h1>
<p>No roadmap. No utility. Only UP.</p>

<a class="btn buy" href="#">BUY NOW</a>

<div class="card">
  <h2>Live Stats</h2>

  <div>Price: <b id="price"></b></div>
  <div>Market Cap: <b id="mc"></b></div>
  <div>Liquidity: <b id="liq"></b></div>
  <div>Volume 24h: <b id="vol"></b></div>

  <div class="trend" id="trend"></div>

  <div>Momentum</div>
  <div class="bar">
    <div class="fill" id="momentum"></div>
  </div>

  <div>Buy Pressure</div>
  <div class="bar">
    <div class="fill" id="pressure"></div>
  </div>

</div>

<div class="card">
  <h2>Recent Activity</h2>
  <div id="activity"></div>
</div>

<div class="card">
  <h2>Contract</h2>
  <div id="contract">PASTE CONTRACT HERE</div>
  <button onclick="copy()">Copy</button>
</div>

<div class="card">
  <h2>Chart</h2>
  <iframe src="https://dexscreener.com/solana/9pr6geoq2ezhg86xbmbg6548xeagkvqysdbjw7hzuehf?embed=1&theme=dark" width="100%" height="420"></iframe>
</div>

</div>

<script>

const pair = "9pr6geoq2ezhg86xbmbg6548xeagkvqysdbjw7hzuehf";

let lastPrice = 0;

function format(x){
  return "$" + Number(x).toLocaleString();
}

async function load(){

  const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/solana/${pair}`);
  const data = await res.json();
  const p = data.pair;

  let price = parseFloat(p.priceUsd);

  let priceEl = document.getElementById("price");
  priceEl.innerText = "$" + price.toFixed(8);

  if(price > lastPrice){
    priceEl.classList.add("priceFlash");
    setTimeout(()=>priceEl.classList.remove("priceFlash"),300);
  }

  lastPrice = price;

  document.getElementById("mc").innerText = format(p.fdv);
  document.getElementById("liq").innerText = format(p.liquidity.usd);
  document.getElementById("vol").innerText = format(p.volume.h24);

  // MOMENTUM
  let momentum = Math.min(100, p.volume.h24 / 1000);
  document.getElementById("momentum").style.width = momentum + "%";

  // BUY PRESSURE
  let pressure = Math.random() * 100;
  document.getElementById("pressure").style.width = pressure + "%";

  // TREND
  let trend = "⚪ Stable";
  if(price > lastPrice) trend = "🚀 Pumping";
  if(price < lastPrice) trend = "🔻 Pullback";

  document.getElementById("trend").innerText = trend;

  // ACTIVITY ENGINE
  let html = "";
  let ticker = "";

  let activityLevel = Math.floor(p.volume.h24 / 5000);

  for(let i=0;i<Math.max(3, activityLevel);i++){

    let sol = (Math.random()*2).toFixed(2);
    let wallet = Math.random().toString(36).substring(2,7);

    html += `<div class="green">+ ${sol} SOL • ${wallet} bought</div>`;
    ticker += `<span>🚀 ${sol} SOL buy</span>`;
  }

  document.getElementById("activity").innerHTML = html;
  document.getElementById("ticker").innerHTML = ticker;

}

function copy(){
  navigator.clipboard.writeText(document.getElementById("contract").innerText);
  alert("Copied contract!");
}

load();
setInterval(load, 4000);

</script>

</body>
</html>
