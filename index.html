<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VYRON</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a, #1d4ed8);
      color: white;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .logo {
      width: 180px;
      border-radius: 24px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 56px;
      margin: 0;
      font-weight: 900;
      letter-spacing: 2px;
    }
    p {
      font-size: 20px;
      color: #cbd5e1;
      max-width: 700px;
      margin: 20px auto;
    }
    .btns {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 14px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
    }
    .primary {
      background: #22d3ee;
      color: #020617;
    }
    .secondary {
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
    }
    .card-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 50px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 20px;
    }
    .small {
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="https://via.placeholder.com/300x300.png?text=VYRON" alt="VYRON logo">
    <h1>VYRON</h1>
    <p>Built for speed, driven by momentum. A clean, launch-ready community coin with a premium look.</p>

    <div class="btns">
      <a class="btn primary" href="https://t.me/VyronPortal" target="_blank">Join Telegram</a>
      <a class="btn secondary" href="https://x.com/VyronCoin" target="_blank">Follow on X</a>
    </div>

    <div class="card-wrap">
      <div class="card">
        <div class="small">Ticker</div>
        <h3>VYR</h3>
      </div>
      <div class="card">
        <div class="small">Chain</div>
        <h3>Solana</h3>
      </div>
      <div class="card">
        <div class="small">Launch Type</div>
        <h3>Fair Launch</h3>
      </div>
    </div>
  </div>
</body>
</html>
